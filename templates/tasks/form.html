{% extends "base.html" %}
{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %}{% endblock %}
{% block breadcrumb %}
  <a href="{{ url_for('tasks_list') }}" class="text-muted text-decoration-none">Tasks</a>
  &rsaquo; {% if task %}Edit{% else %}New{% endif %}
{% endblock %}

{% block content %}
<form method="post">
<div class="row g-4 justify-content-center">
  <div class="col-lg-6">

    <div class="card mb-3">
      <div class="card-header"><span class="section-header mb-0">Task Details</span></div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label">Title *</label>
            <input type="text" name="title" class="form-control form-control-sm" required
                   value="{{ task.title if task else '' }}"
                   placeholder="e.g. Follow up with John on balance payment">
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control form-control-sm" rows="2"
                      placeholder="More detail if needed">{{ task.description if task else '' }}</textarea>
          </div>
          <div class="col-6">
            <label class="form-label">Due Date</label>
            <input type="date" name="due_date" class="form-control form-control-sm"
                   value="{{ task.due_date if task else '' }}">
          </div>
          <div class="col-6">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select form-select-sm">
              {% for p in ['Low','Normal','High','Urgent'] %}
              <option {% if task and task.priority==p %}selected{% elif not task and p=='Normal' %}selected{% endif %}>{{ p }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Status</label>
            <select name="status" class="form-select form-select-sm">
              {% for s in ['Pending','In Progress','Done'] %}
              <option {% if task and task.status==s %}selected{% elif not task and s=='Pending' %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Assigned To</label>
            <input type="text" name="assigned_to" class="form-control form-control-sm"
                   value="{{ task.assigned_to if task else '' }}" placeholder="Hillary / Dennis / Both">
          </div>
          <div class="col-12">
            <label class="form-label">Linked Quotation <span class="text-muted">(optional)</span></label>
            <select name="linked_quotation_id" class="form-select form-select-sm">
              <option value="">— None —</option>
              {% for q in quotations %}
              <option value="{{ q.id }}"
                {% if task and task.linked_quotation_id==q.id %}selected{% endif %}>
                {{ q.quotation_no }} — {{ q.customer_name }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control form-control-sm" rows="2">{{ task.notes if task else '' }}</textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Save Task</button>
      <a href="{{ url_for('tasks_list') }}" class="btn btn-outline-secondary">Cancel</a>
      {% if task %}
      <form method="post" action="{{ url_for('tasks_delete', tid=task.id) }}" class="ms-auto"
            onsubmit="return confirm('Delete this task?')">
        <button class="btn btn-outline-danger"><i class="bi bi-trash"></i> Delete</button>
      </form>
      {% endif %}
    </div>

  </div>
</div>
</form>
{% endblock %}
