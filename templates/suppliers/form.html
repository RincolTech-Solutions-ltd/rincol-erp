{% extends "base.html" %}
{% block title %}{% if supplier %}Edit Supplier{% else %}New Supplier{% endif %}{% endblock %}
{% block breadcrumb %}
  <a href="{{ url_for('suppliers_list') }}" class="text-muted text-decoration-none">Suppliers</a>
  &rsaquo; {% if supplier %}Edit{% else %}New{% endif %}
{% endblock %}

{% block content %}
<form method="post">
<div class="row g-4 justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header"><span class="section-header mb-0">Supplier Details</span></div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-5">
            <label class="form-label">ID</label>
            <input type="text" name="id" class="form-control form-control-sm font-monospace"
                   value="{{ supplier.id if supplier else '' }}" {% if supplier %}readonly{% endif %} placeholder="SUP-...">
          </div>
          <div class="col-12">
            <label class="form-label">Company Name *</label>
            <input type="text" name="name" class="form-control form-control-sm" required
                   value="{{ supplier.name if supplier else '' }}">
          </div>
          <div class="col-6">
            <label class="form-label">Contact Person</label>
            <input type="text" name="contact_person" class="form-control form-control-sm"
                   value="{{ supplier.contact_person if supplier else '' }}">
          </div>
          <div class="col-6">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control form-control-sm"
                   value="{{ supplier.phone if supplier else '' }}">
          </div>
          <div class="col-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control form-control-sm"
                   value="{{ supplier.email if supplier else '' }}">
          </div>
          <div class="col-6">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control form-control-sm"
                   value="{{ supplier.location if supplier else '' }}">
          </div>
          <div class="col-12">
            <label class="form-label">Categories (comma-separated)</label>
            <input type="text" name="categories" class="form-control form-control-sm"
                   value="{{ supplier.categories if supplier else '' }}" placeholder="e.g. Battery, Inverter">
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control form-control-sm" rows="2">{{ supplier.notes if supplier else '' }}</textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Save</button>
      <a href="{{ url_for('suppliers_list') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </div>
</div>
</form>
{% endblock %}
